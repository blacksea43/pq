
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111118">
<title>Metin Görüntüleyici</title>
<style>
:root {
  color-scheme: dark;
  --bg: #111118;
  --panel: #1b1b25;
  --border: #343044;
  --text: #f4f0ff;
  --muted: #aaa5bd;
  --accent: #a78bfa;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 30px 16px;
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #292044, transparent 55%), var(--bg);
  color: var(--text);
  font-family: system-ui, Arial, sans-serif;
}
main { width: min(100%, 850px); margin: auto; }
.eyebrow {
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}
h1 { margin: 8px 0; font-size: clamp(26px, 5vw, 38px); }
.description { color: var(--muted); line-height: 1.6; }
.panel {
  margin-top: 24px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--panel);
  box-shadow: 0 18px 60px #0003;
}
.head, .foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 16px 20px;
}
.head { border-bottom: 1px solid var(--border); }
.foot { border-top: 1px solid var(--border); }
.status, .updated { color: var(--muted); font-size: 12px; }
pre {
  min-height: 180px;
  max-height: 70vh;
  overflow: auto;
  margin: 0;
  padding: 24px;
  color: var(--text);
  font: 14px/1.85 Consolas, monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
button, .link {
  display: inline-block;
  padding: 10px 14px;
  border: 1px solid #a78bfa66;
  border-radius: 9px;
  background: #a78bfa18;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  text-decoration: none;
  cursor: pointer;
}
button:hover, .link:hover { background: #a78bfa35; }
button:disabled { opacity: .6; cursor: wait; }
@media(max-width:480px) {
  body { padding: 22px 12px; }
  pre { padding: 17px; font-size: 13px; }
  .head, .foot { padding: 14px; }
}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Canlı metin</div>
  <h1>Metin Görüntüleyici</h1>
  <p class="description">
    Google Drive üzerindeki TXT dosyasının güncel içeriği.
  </p>

  <section class="panel">
    <div class="head">
      <strong>TXT Dosyası</strong>
      <span id="status" class="status" role="status" aria-live="polite">
        Yükleniyor...
      </span>
    </div>

    <pre id="content">İçerik yükleniyor...</pre>

    <div class="foot">
      <span id="updated" class="updated"></span>
      <div class="actions">
        <button id="reload" type="button">↻ Yenile</button>
        <a id="open" class="link"
           href="https://drive.google.com/file/d/10Q_u9kB9M3qydahQOlC6xOZeXyD9MEEu/view?usp=sharing"
           target="_blank" rel="noopener noreferrer">Drive'da aç</a>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const FILE_ID = "10Q_u9kB9M3qydahQOlC6xOZeXyD9MEEu";

  /*
    Apps Script'i kurduktan sonra /exec adresini buraya ekle.
    Boş bırakılırsa doğrudan Drive bağlantısı denenir;
    bu yöntem CORS nedeniyle başarısız olabilir.
  */
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2Mc3UNK5ycZF5u8jQwopmpkiTzAKJL4hVFZROJ0OMvarx42AXKFT8eyIHaXJhFl7r/exec";

  const content = document.getElementById("content");
  const status = document.getElementById("status");
  const updated = document.getElementById("updated");
  const reload = document.getElementById("reload");

  let loading = false;

  function setStatus(message) {
    status.textContent = message;
  }

  function showError(message) {
    content.textContent = message;
    setStatus("Yüklenemedi");
  }

  async function loadText() {
    if (loading) return;

    loading = true;
    reload.disabled = true;
    setStatus("Yükleniyor...");

    try {
      let text;

      if (APPS_SCRIPT_URL.trim()) {
        // Apps Script web uygulaması JSON yanıtı döndürmelidir.
        const response = await fetch(APPS_SCRIPT_URL, {
          cache: "no-store",
          redirect: "follow"
        });

        if (!response.ok) {
          throw new Error("Apps Script HTTP " + response.status);
        }

        const data = await response.json();

        if (!data || typeof data.text !== "string") {
          throw new Error("Geçersiz sunucu yanıtı");
        }

        text = data.text;
      } else {
        // Yedek yöntem: Google Drive'dan doğrudan indirmeyi dene.
        const url =
          "https://drive.google.com/uc?export=download&id=" +
          encodeURIComponent(FILE_ID);

        const response = await fetch(url, { cache: "no-store" });

        if (!response.ok) {
          throw new Error("Drive HTTP " + response.status);
        }

        text = await response.text();

        if (/<(?:!doctype html|html)\b/i.test(text)) {
          throw new Error("Drive HTML sayfası döndürdü");
        }
      }

      content.textContent = text;
      setStatus("Güncel");
      updated.textContent =
        "Son yükleme: " +
        new Date().toLocaleTimeString("tr-TR");
    } catch (error) {
      console.error("TXT yükleme hatası:", error);

      showError(
        "TXT içeriği otomatik yüklenemedi.\n\n" +
        "Drive erişimi veya CORS engeli oluşmuş olabilir. " +
        "Güvenilir otomatik yükleme için Google Apps Script " +
        "web uygulaması yapılandırıp URL'sini koda ekle."
      );

      updated.textContent = "Bağlantıyı kontrol et";
    } finally {
      loading = false;
      reload.disabled = false;
    }
  }

  reload.addEventListener("click", loadText);

  // Her sayfa açılışında güncel içeriği iste.
  loadText();
})();
</script>
</body>
</html>
