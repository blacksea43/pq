<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#111118">
<title>question og</title>
<style>
:root {
  color-scheme: dark;
  --bg: #111118;
  --text: #f4f0ff;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}
body {
  min-height: 100vh;
  padding: 28px 16px;
  font-family: system-ui, Arial, sans-serif;
}
main { width: min(100%, 850px); margin: auto; }
pre {
  margin: 0;
  font: 15px/1.85 Consolas, monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--text);
}
@media (max-width: 480px) {
  body { padding: 20px 12px; }
  pre { font-size: 14px; }
}
</style>
</head>
<body>
<main>
  <pre id="content">Yükleniyor...</pre>
</main>

<script>
(() => {
  "use strict";

  const FILE_ID = "10Q_u9kB9M3qydahQOlC6xOZeXyD9MEEu";
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2Mc3UNK5ycZF5u8jQwopmpkiTzAKJL4hVFZROJ0OMvarx42AXKFT8eyIHaXJhFl7r/exec";

  const content = document.getElementById("content");

  async function loadText() {
    try {
      let text;

      if (APPS_SCRIPT_URL.trim()) {
        const response = await fetch(APPS_SCRIPT_URL, {
          cache: "no-store",
          redirect: "follow"
        });
        if (!response.ok) throw new Error("Apps Script HTTP " + response.status);

        const data = await response.json();
        if (!data || typeof data.text !== "string") {
          throw new Error("Geçersiz sunucu yanıtı");
        }
        text = data.text;
      } else {
        const response = await fetch(
          "https://drive.google.com/uc?export=download&id=" +
            encodeURIComponent(FILE_ID),
          { cache: "no-store" }
        );
        if (!response.ok) throw new Error("Drive HTTP " + response.status);

        text = await response.text();
        if (/<(?:!doctype html|html)\b/i.test(text)) {
          throw new Error("Drive HTML sayfası döndürdü");
        }
      }

      content.textContent = text;
    } catch (error) {
      // Hata durumunda "Yükleniyor..." yazısı kaldırılır; hata yalnızca konsola yazılır.
      content.textContent = "";
      console.error("TXT yükleme hatası:", error);
    }
  }

  loadText();
})();
</script>
</body>
</html>
